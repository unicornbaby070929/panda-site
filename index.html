<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>熊貓小站</title>
  <link rel="stylesheet" href="style.css">
</head>
  <!-- 人物介紹彈窗 -->
  <div id="profile-popup" class="profile-popup hidden">
    <div class="profile-content">
      <button id="profile-close" class="close-btn">✖</button>
      <div class="profile-header">
        <img id="profile-img" src="images/yingying.jpg" alt="熊貓照片">
        <h2 id="profile-name">名字</h2>
        <p id="profile-nickname" class="nickname">花名：...</p>
      </div>
      <div class="profile-body">
        <p><strong>性格：</strong><span id="profile-personality">...</span></p>
        <p><strong>最愛做的事：</strong><span id="profile-hobby">...</span></p>
        <p><strong>小特點：</strong><span id="profile-trait">...</span></p>
        <p><strong>生日／年齡：</strong><span id="profile-age">...</span></p>
      </div>
    </div>
  </div>
<body>
<!-- 飄落裝飾 -->
<div class="petals" id="petals"></div>
  <!-- 導航列 -->
  <nav>
    <h1>🐼 熊貓小站</h1>
    <div class="nav-buttons">
      <button data-tab="home" class="active">首頁</button>
      <button data-tab="timer">計時</button>
      <button data-tab="chat">聊天</button>
      <button data-tab="study">學習</button>
    </div>
    <button id="notify-btn" class="notify-btn">🔔 開啟吃飯提醒</button>
  </nav>

  <!-- 首頁 -->
  <section id="home" class="tab active">
    <img src="images/panda.jpg" alt="熊貓" width="300" class="panda-cursor">
    <h2>歡迎來到熊貓小站</h2>
    <p>深呼吸，慢慢來，熊貓陪你一起放鬆 🍃</p>

    <!-- 熊貓圖鑑 -->
    <div class="panda-gallery">
      <h3>🐼 熊貓家庭成員</h3>
      <p class="hint">點擊照片看介紹</p>
      
      <div class="gallery-grid">
        <!-- 盈盈 -->
        <div class="gallery-card" onclick="openProfile('yingying')">
          <img src="images/yingying.jpg" alt="盈盈">
          <p>🌿 盈盈</p>
        </div>
        <!-- 樂樂 -->
        <div class="gallery-card" onclick="openProfile('lele')">
          <img src="images/lele.jpg" alt="樂樂">
          <p>💧 樂樂</p>
        </div>
        <!-- 加加 -->
        <div class="gallery-card" onclick="openProfile('jiajia')">
          <img src="images/jiajia.jpg" alt="加加">
          <p>🎋 加加</p>
        </div>
        <!-- 得得 -->
        <div class="gallery-card" onclick="openProfile('dede')">
          <img src="images/dede.jpg" alt="得得">
          <p>🍃 得得</p>
        </div>
      </div>
    </div>
  </section>
   <!-- 計時 -->
  <section id="timer" class="tab">
    <h2>⏱️ 番茄鐘</h2>
    <div id="time-display">25:00</div>
    <div class="timer-buttons">
      <button id="start-btn">開始</button>
      <button id="reset-btn">重設</button>
    </div>
    <p class="hint">🐼 專注 25 分鐘，然後休息 5 分鐘</p>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="tab">
    <h2>💬 跟熊貓聊天</h2>

    <!-- 選熊貓 -->
       <div class="panda-select">
      <button class="panda-choice active" data-panda="yingying">🌿 盈盈</button>
      <button class="panda-choice" data-panda="lele">💧 樂樂</button>
      <button class="panda-choice" data-panda="jiajia">🎋 加加</button>
      <button class="panda-choice" data-panda="dede">🍃 得得</button>
    </div>

    <div id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="跟熊貓說說話...">
      <button id="send-btn">送出</button>
    </div>
        <!-- 熊貓表情包按鈕 -->
    <div class="emoji-bar">
      <button class="emoji-btn" data-emoji="🐼">🐼</button>
      <button class="emoji-btn" data-emoji="🎋">🎋</button>
      <button class="emoji-btn" data-emoji="🍃">🍃</button>
      <button class="emoji-btn" data-emoji="💧">💧</button>
      <button class="emoji-btn" data-emoji="🥺">🥺</button>
      <button class="emoji-btn" data-emoji="🤣">🤣</button>
      <button class="emoji-btn" data-emoji="💖">💖</button>
      <button class="emoji-btn" data-emoji="😴">😴</button>
    </div>
  </section>

  <!-- 學習 -->
  <section id="study" class="tab">
    <h2>📚 學習待辦</h2>
    <div class="todo-input">
      <input type="text" id="todo-input" placeholder="今天要學什麼？">
      <button id="add-btn">新增</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="hint">🐼 點文字打勾，點 ❌ 刪除</p>
  </section>
  <!-- 完成任務恭喜彈窗 -->
  <div id="congrats-popup" class="congrats-popup hidden">
    <div class="congrats-content">
      <div class="congrats-panda">🐼</div>
      <h2 id="congrats-text">太棒了！</h2>
      <button id="congrats-close">謝謝熊貓！</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
